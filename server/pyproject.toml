[project]
name = "gonative"
version = "0.1.0"
description = "LangLearn backend - AI-powered language learning API (Hindi -> English)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Databases
    "databases[asyncpg]>=0.9.0",    # async DB queries
    "psycopg2-binary>=2.9.0",       # needed for alembic migrations
    "sqlalchemy>=2.0.0",            # only for table definitions + alembic
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # HTTP client
    "httpx>=0.27.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    # AI + validation
    "google-generativeai>=0.8.3",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
